<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ma Boutique</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

    <div class="logo">
        🛍️ Ma Boutique
    </div>


    <div class="cart-header">
        Panier :
        <span id="cart-count">0</span>
    </div>

</header>



<section class="hero">

    <h1>
        Nouvelle Collection
    </h1>

    <p>
        Découvrez nos produits phares
    </p>

</section>




<!-- FILTRE CATEGORIES -->

<div class="filters">

    <button onclick="filterProducts('all')">
        Tous
    </button>

    <button onclick="filterProducts('vetements')">
        👕 Vêtements
    </button>

    <button onclick="filterProducts('shoes')">
        👟 Shoes
    </button>

    <button onclick="filterProducts('accessoires')">
        🧢 Accessoires
    </button>

</div>






<main>



<section class="products">



<!-- T-SHIRT -->

<div class="product" data-category="vetements">


<img
src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=800&q=80"
alt="T-shirt">


<div class="product-content">


<h3>
T-shirt Premium
</h3>


<div class="price">
20 €
</div>



<div class="qty-container">

<label>
Quantité
</label>


<input
type="number"
id="qty-tshirt"
value="1"
min="1"
max="99">

</div>



<button onclick="addToCart('T-shirt Premium',20,'tshirt')">

Ajouter au panier

</button>


</div>


</div>








<!-- CASQUETTE -->


<div class="product" data-category="accessoires">


<img
src="https://images.unsplash.com/photo-1521369909029-2afed882baee?auto=format&fit=crop&w=800&q=80"
alt="Casquette">


<div class="product-content">


<h3>
Casquette
</h3>


<div class="price">
15 €
</div>



<div class="qty-container">

<label>
Quantité
</label>


<input
type="number"
id="qty-casquette"
value="1"
min="1"
max="99">

</div>



<button onclick="addToCart('Casquette',15,'casquette')">

Ajouter au panier

</button>


</div>


</div>








<!-- SNEAKERS -->


<div class="product" data-category="shoes">


<img
src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=800&q=80"
alt="Sneakers">


<div class="product-content">


<h3>
Sneakers
</h3>



<div class="price">
60 €
</div>




<div class="qty-container">

<label>
Quantité
</label>


<input
type="number"
id="qty-sneakers"
value="1"
min="1"
max="99">

</div>



<button onclick="addToCart('Sneakers',60,'sneakers')">

Ajouter au panier

</button>


</div>


</div>





</section>







<!-- PANIER -->


<aside class="cart-box">


<h2>
🧺 Votre panier
</h2>


<ul id="cart-items">

</ul>



<div class="total">

Total :
<span id="total">
0.00
</span>
€

</div>



<button
class="clear-btn"
onclick="clearCart()">

🗑️ Vider le panier

</button>



<button
class="pay-btn"
onclick="goToCheckout()">

💳 Commander

</button>



</aside>



</main>





<script src="app.js"></script>


</body>

</html>

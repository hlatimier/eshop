<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Boutique</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>🛍️ Ma Boutique</h1>
  <div>Panier : <span id="cart-count">0</span></div>
</header>

<main>

<section class="products">

  <div class="product">
    <h3>T-shirt</h3>
    <input id="qty-tshirt" type="number" value="1" min="0" max="100">
    <button onclick="addToCart('T-shirt',20,'tshirt')">Ajouter</button>
  </div>

  <div class="product">
    <h3>Casquette</h3>
    <input id="qty-casquette" type="number" value="1" min="0" max="100">
    <button onclick="addToCart('Casquette',15,'casquette')">Ajouter</button>
  </div>

</section>

<aside class="cart-box">
  <h2>Panier</h2>
  <ul id="cart-items"></ul>

  <p>Total : <span id="total">0</span> €</p>

  <!-- 🔥 redirection vers page paiement -->
  <button onclick="goToCheckout()">💳 Payer</button>

</aside>

</main>

<script src="script.js"></script>
</body>
</html>

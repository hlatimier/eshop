<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ma Boutique</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>🛍️ Ma Boutique</h1>
  <div>Panier : <span id="cart-count">0</span></div>
</header>

<main>

  <!-- PRODUITS -->
  <section class="products">

    <div class="product" data-category="vetements">
      <h3>T-shirt</h3>
      <input id="qty-tshirt" type="number" value="1" min="0" max="100">
      <button onclick="addToCart('T-shirt', 20, 'tshirt')">Ajouter</button>
    </div>

    <div class="product" data-category="vetements">
      <h3>Casquette</h3>
      <input id="qty-casquette" type="number" value="1" min="0" max="100">
      <button onclick="addToCart('Casquette', 15, 'casquette')">Ajouter</button>
    </div>

  </section>

  <!-- PANIER -->
  <aside class="cart-box">
    <h2>🧺 Panier</h2>
    <ul id="cart-items"></ul>

    <p>Total : <span id="total">0</span> €</p>

    <button onclick="openPayment()">💳 Payer</button>

    <p class="warning">⚠️ Tous les paiements sont fictifs</p>
  </aside>

</main>

<!-- 🔥 ÉCRAN PAIEMENT -->
<div id="paymentModal" class="modal">

  <div class="modal-content">

    <h2>Paiement</h2>

    <p class="warning">Tous les paiements sont fictifs</p>

    <div class="pay-options">

      <button onclick="fakeCard()">💳 Carte bancaire française</button>
      <button onclick="fakePaypal()">🅿️ PayPal</button>

    </div>

    <div id="paymentForm"></div>

    <button onclick="closePayment()">Fermer</button>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>

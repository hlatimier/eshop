
            </button>

        </div>

    </div>

</section>

<aside class="cart-box">

    <h2>🧺 Votre panier</h2>

    <ul id="cart-items"></ul>

    <div class="total">
        Total : <span id="total">0.00</span> €
    </div>

    <button
        class="pay-btn"
        onclick="goToCheckout()">
        💳 Commander
    </button>

</aside>

</main>

<script>

let cart = [];
let total = 0;

function addToCart(name, price, id){

    let qty =
        parseInt(
            document.getElementById(
                "qty-" + id
            ).value
        );

    if(!qty || qty < 1){
        qty = 1;
    }

    const existing =
        cart.find(
            item => item.name === name
        );

    if(existing){

        existing.qty += qty;

    }else{

        cart.push({
            name:name,
            price:price,
            qty:qty
        });

    }

    updateCart();
}

function updateCart(){

    const cartItems =
        document.getElementById(
            "cart-items"
        );

    cartItems.innerHTML = "";

    total = 0;

    let count = 0;

    cart.forEach(item=>{

        const subtotal =
            item.price * item.qty;

        total += subtotal;

        count += item.qty;

        const li =
            document.createElement("li");

        li.innerHTML =
            `<strong>${item.name}</strong><br>
            Quantité : ${item.qty}<br>
            ${subtotal.toFixed(2)} €`;

        cartItems.appendChild(li);

    });

    document.getElementById(
        "total"
    ).textContent =
        total.toFixed(2);

    document.getElementById(
        "cart-count"
    ).textContent =
        count;
}

<script src="app.js"></script>
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma Boutique</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🛍️ Ma Boutique</h1>

    <div>
        Panier :
        <span id="cart-count">0</span>
    </div>
</header>

<main>

<section class="products">

    <!-- T-SHIRT -->
    <div class="product">

        <img
        src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=800&q=80"
        alt="T-shirt">

        <h3>T-shirt</h3>

        <p>20 €</p>

        <input
        id="qty-tshirt"
        type="number"
        value="1"
        min="0"
        max="100">

        <button onclick="addToCart('T-shirt',20,'tshirt')">
            Ajouter
        </button>

    </div>

    <!-- CASQUETTE -->
    <div class="product">

        <img
        src="https://images.unsplash.com/photo-1521369909029-2afed882baee?auto=format&fit=crop&w=800&q=80"
        alt="Casquette">

        <h3>Casquette</h3>

        <p>15 €</p>

        <input
        id="qty-casquette"
        type="number"
        value="1"
        min="0"
        max="100">

        <button onclick="addToCart('Casquette',15,'casquette')">
            Ajouter
        </button>

    </div>

    <!-- SNEAKERS -->
    <div class="product">

        <img
        src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=800&q=80"
        alt="Sneakers">

        <h3>Sneakers</h3>

        <p>60 €</p>

        <input
        id="qty-sneakers"
        type="number"
        value="1"
        min="0"
        max="100">

        <button onclick="addToCart('Sneakers',60,'sneakers')">
            Ajouter
        </button>

    </div>

</section>

<aside class="cart-box">

    <h2>🧺 Panier</h2>

    <ul id="cart-items"></ul>

    <h3>
        Total :
        <span id="total">0.00</span> €
    </h3>

    <button
    class="pay-btn"
    onclick="goToCheckout()">
        💳 Payer
    </button>

</aside>

</main>

<script src="script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boutique</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>🛍️ Ma Boutique</h1>
  <div id="cart">Panier : <span id="cart-count">0</span></div>
</header>

<div class="filters">
  <button onclick="filterProducts('all')">Tous</button>
  <button onclick="filterProducts('vetements')">Vêtements</button>
  <button onclick="filterProducts('shoes')">Shoes</button>
</div>

<main>

  <!-- PRODUITS -->
  <section class="products">

    <div class="product" data-category="vetements">
      <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab">
      <h3>T-shirt</h3>
      <p>19.99 €</p>

      <div class="qty-box">
        <button onclick="changeQty('tshirt', -1)">-</button>
        <input id="qty-tshirt" type="number" value="1" min="0" max="100"
          onchange="setQty('tshirt', this.value)">
        <button onclick="changeQty('tshirt', 1)">+</button>
      </div>

      <button onclick="addToCart('T-shirt', 19.99, 'tshirt')">Ajouter</button>
    </div>

    <div class="product" data-category="vetements">
      <img src="https://images.unsplash.com/photo-1519741497674-611481863552">
      <h3>Casquette</h3>
      <p>14.99 €</p>

      <div class="qty-box">
        <button onclick="changeQty('casquette', -1)">-</button>
        <input id="qty-casquette" type="number" value="1" min="0" max="100"
          onchange="setQty('casquette', this.value)">
        <button onclick="changeQty('casquette', 1)">+</button>
      </div>

      <button onclick="addToCart('Casquette', 14.99, 'casquette')">Ajouter</button>
    </div>

    <div class="product" data-category="shoes">
      <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff">
      <h3>Sneakers</h3>
      <p>59.99 €</p>

      <div class="qty-box">
        <button onclick="changeQty('sneakers', -1)">-</button>
        <input id="qty-sneakers" type="number" value="1" min="0" max="100"
          onchange="setQty('sneakers', this.value)">
        <button onclick="changeQty('sneakers', 1)">+</button>
      </div>

      <button onclick="addToCart('Sneakers', 59.99, 'sneakers')">Ajouter</button>
    </div>

  </section>

  <!-- PANIER -->
  <aside class="cart-box">
    <h2>🧺 Panier</h2>
    <ul id="cart-items"></ul>

    <p>Total : <span id="total">0</span> €</p>

    <button onclick="pay()">💳 Payer</button>
  </aside>

</main>

<script src="script.js"></script>
</body>
</html>

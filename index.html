<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mini e-commerce</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Ma Boutique</h1>
  <div id="cart">Panier : <span id="cart-count">0</span> article(s)</div>
</header>

<main>

  <section class="products">

    <div class="product">
      <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400" alt="T-shirt">
      <h3>T-shirt</h3>
      <p>19.99 €</p>
      <button onclick="addToCart('T-shirt', 19.99)">Ajouter</button>
    </div>

    <div class="product">
      <img src="https://images.unsplash.com/photo-1521369909029-2afed882baee?w=600" alt="Casquette">
      <h3>Casquette</h3>
      <p>14.99 €</p>
      <button onclick="addToCart('Casquette', 14.99)">Ajouter</button>
    </div>

    <div class="product">
      <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400" alt="Sneakers">
      <h3>Sneakers</h3>
      <p>59.99 €</p>
      <button onclick="addToCart('Sneakers', 59.99)">Ajouter</button>
    </div>

  </section>

  <aside class="cart-box">
    <h2>Panier</h2>
    <ul id="cart-items"></ul>
    <p><strong>Total : <span id="total">0</span> €</strong></p>
  </aside>

</main>

<script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma Boutique</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">🛍️ Ma Boutique</div>

    <nav>
        <a href="#">Accueil</a>
        <a href="#">Boutique</a>
        <a href="#">Contact</a>
    </nav>

    <div class="cart-header">
        🧺 <span id="cart-count">0</span>
    </div>
</header>

<section class="hero">
    <h1>Nouvelle Collection 2026</h1>
    <p>Découvrez nos meilleures offres</p>
</section>

<section class="search-bar">
    <input type="text" placeholder="Rechercher un produit...">
</section>

<main>

<section class="products">

    <div class="product">

        <span class="badge">Nouveau</span>

        <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=800&q=80">

        <h3>T-shirt Premium</h3>

        <p class="price">20 €</p>

        <input id="qty-tshirt" type="number" value="1" min="1">

        <button onclick="addToCart('T-shirt Premium',20,'tshirt')">
            Ajouter au panier
        </button>

    </div>

    <div class="product">

        <img src="https://images.unsplash.com/photo-1521369909029-2afed882baee?auto=format&fit=crop&w=800&q=80">

        <h3>Casquette</h3>

        <p class="price">15 €</p>

        <input id="qty-casquette" type="number" value="1" min="1">

        <button onclick="addToCart('Casquette',15,'casquette')">
            Ajouter au panier
        </button>

    </div>

    <div class="product">

        <span class="badge promo">Promo</span>

        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=800&q=80">

        <h3>Sneakers</h3>

        <p class="price">60 €</p>

        <input id="qty-sneakers" type="number" value="1" min="1">

        <button onclick="addToCart('Sneakers',60,'sneakers')">
            Ajouter au panier
        </button>

    </div>

</section>

<aside class="cart-box">

    <h2>🧺 Votre panier</h2>

    <ul id="cart-items"></ul>

    <div class="cart-total">
        Total : <span id="total">0.00</span> €
    </div>

    <button class="pay-btn" onclick="goToCheckout()">
        💳 Commander
    </button>

</aside>

</main>

<script src="app.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>checkout</title>

<link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="checkout-container">

  <h2>💳 Paiement</h2>

  <div id="summary"></div>

  <div class="checkout-total">
    Total : <span id="checkout-total">0.00</span> €
  </div>

  <p class="warning">
    ⚠️ Tous les paiements sont fictifs
  </p>

  <div class="payment-section">

    <h3>Carte bancaire</h3>

    <input type="text" placeholder="Nom du titulaire">

    <input type="text" placeholder="Numéro de carte">

    <div class="card-row">
      <input type="text" placeholder="MM/AA">
      <input type="text" placeholder="CVC">
    </div>

    <button onclick="fakeCardPayment()">
      💳 Payer par carte
    </button>

  </div>

  <div class="payment-section">

    <h3>PayPal</h3>

    <input type="email" placeholder="Adresse e-mail PayPal">

    <button onclick="fakePaypalPayment()">
      🅿️ Payer avec PayPal
    </button>

  </div>
    </body>
</html>

</div>

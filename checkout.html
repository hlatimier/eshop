<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paiement</title>


</head>

<body>

<header>
    <h1>🛍️ Ma Boutique</h1>

    <div>
        Checkout
    </div>
</header>

<main>

    <section class="products">

        <div class="checkout-box">

            <h2>💳 Paiement</h2>

            <div id="summary"></div>

            <h3>
                Total :
                <span id="checkout-total">0.00</span> €
            </h3>

            <p class="warning">
                ⚠️ Tous les paiements sont fictifs
            </p>

        </div>

        <div class="product">

            <h3>Carte bancaire</h3>

            <input type="text" placeholder="Numéro de carte">

            <input type="text" placeholder="MM/AA">

            <input type="text" placeholder="CVC">

            <button onclick="fakeCardPayment()">
                Payer par carte
            </button>

        </div>

        <div class="product">

            <h3>PayPal</h3>

            <input type="email" placeholder="Email PayPal">

            <button onclick="fakePaypalPayment()">
                Payer avec PayPal
            </button>

        </div>

    </section>

</main>

<script src="checkout.js"></script>

</body>
</html>
